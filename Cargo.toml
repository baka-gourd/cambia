[package]
name = "cambia"
version = "0.1.0"
edition = "2021"

[features]
default = ["server"]
server = [
    "dep:axum",
    "dep:axum-client-ip",
    "dep:axum-extra",
    "dep:axum-msgpack",
    "dep:figlet-rs",
    "dep:futures",
    "dep:mime_guess",
    "dep:rmp-serde",
    "dep:rust-embed",
    "dep:serde",
    "dep:tokio",
    "dep:tower-http",
]
experimental_rippers = ["cambia-core/experimental_rippers"]
experimental_evaluators = ["cambia-core/experimental_evaluators"]
gui_profiler = []

[dependencies]
cambia-core = { path = "cambia-core" }
mime_guess = { version = "2.0.5", optional = true }
tracing-subscriber = "0.3.23"
figlet-rs = { version = "0.1.5", optional = true }
tracing = "0.1.44"
hex = "0.4.3"
tower-http = { version = "0.5.2", features = ["compression-full", "cors", "decompression-full", "trace"], optional = true }
futures = { version = "0.3.32", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = "1.0.150"
rmp-serde = { version = "1.3.1", optional = true }
tokio = { version = "1.53.0", features = ["full"], optional = true }
clap = { version = "4.6.2", features = ["env", "derive"] }
axum = { version = "0.7.9", features = ["ws"], optional = true }
axum-extra = { version = "0.9.6", features = ["typed-header"], optional = true }
axum-msgpack = { version = "0.4.0", optional = true }
rust-embed = { version = "8.12.0", features = ["axum", "debug-embed", "compression", "include-exclude"], optional = true }
axum-client-ip = { version = "0.6.1", optional = true }
ratatui = { version = "0.29.0", features = ["all-widgets"] }
walkdir = "2.5.0"
rayon = "1.12.0"
winio = { version = "=0.12.0-rc.5", default-features = false, features = ["win32", "win32-dark-mode"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
winio = { path = "../winio/winio" }

[profile.release]
panic = "abort"
# codegen-units = 1
strip = true
lto = "fat"
